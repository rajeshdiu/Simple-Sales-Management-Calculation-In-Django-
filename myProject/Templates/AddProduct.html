{% extends "base.html" %}

{% block body %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Entry Form</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
}

.form-container {
    max-width: 500px;
    margin: 50px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

h2 {
    margin-bottom: 20px;
    color: #333;
}

label {
    display: block;
    margin: 15px 0 5px;
    font-weight: bold;
}

input[type="text"],
input[type="number"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #007BFF;
    color: white;
    border: none;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

    </style>
</head>
<body>

<div class="form-container">
    <h2>Enter Product Details</h2>
    <form method="POST">
        {% csrf_token %}
        
        <label for="product_name">Product Name</label>
        <input type="text" id="product_name" name="product_name" maxlength="200" required>

        <label for="category">Category</label>
        <input type="text" id="category" name="category" maxlength="100" required>

        <label for="unit_price">Unit Price</label>
        <input type="number" step="0.01" id="unit_price" name="unit_price" required>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" required>

        <label for="discount_percent">Discount (%)</label>
        <input type="number" step="0.01" id="discount_percent" name="discount_percent" value="0">

        <label for="tax_percent">Tax (%)</label>
        <input type="number" step="0.01" id="tax_percent" name="tax_percent" value="0">

        <button type="submit">Submit</button>
    </form>
</div>


</body>
</html>


{% endblock body %}
